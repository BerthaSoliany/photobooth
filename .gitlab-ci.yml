variables:
  GIT_DEPTH: "1"
  GIT_STRATEGY: "clone"
  CI_DEBUG_TRACE: "false"
  GIT_TERMINAL_PROMPT: "0"
  
stages:
  - build-and-deploy

deploy_job:
  stage: build-and-deploy
  image: alpine:latest
  before_script:
    # install git, ssh, dan grep untuk linting ringan
    - apk add --no-cache -q git openssh-client grep > /dev/null 2>&1
    - eval $(ssh-agent -s) > /dev/null
    
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$GITHUB_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa > /dev/null 2>&1
    - ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
    - git config --global user.name "GitLab CI Bot"
    - git config --global user.email "ci-bot@gitlab-edu.itb.ac.id"
  script:
    - echo "Deploying..."
    - '! grep -E -n "id=\"[^\"]*\"[[:space:]]+id=" *.html'
    
    # deploy ke GitHub branch production
    - GITHUB_REPO_URL="git@github.com:BerthaSoliany/photobooth.git"
    - git checkout -B production
    - git remote remove github_origin || true
    - git remote add github_origin $GITHUB_REPO_URL
    - git push github_origin production --force > /dev/null 2>&1
  only:
    - main
